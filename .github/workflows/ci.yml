name: Forge.rs GUI CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  validate-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip pkg-config libasound2-dev libwayland-dev libx11-dev libudev-dev
          pip3 install toml 2>/dev/null || pip install toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Clone Horizon source
        run: |
          git clone --depth=1 https://github.com/horizon-rust/horizon.git /tmp/horizon
          echo "HORIZON_PATH=/tmp/horizon" >> $GITHUB_ENV

      - name: Verify .hnmod structure
        run: |
          test -f forge_rs_gui.hnmod
          unzip -l forge_rs_gui.hnmod | grep -q "horizon-native.json"
          unzip -l forge_rs_gui.hnmod | grep -q "horizon-mixin.toml"
          echo "✓ .hnmod structure valid"

      - name: Validate manifest syntax
        run: |
          rm -rf /tmp/mod-extract
          unzip -q -o forge_rs_gui.hnmod -d /tmp/mod-extract
          python3 << 'PYEOF'
          import toml, sys
          try:
              manifest = toml.load('/tmp/mod-extract/mixins/forge_rs_gui/horizon-mixin.toml')
          except Exception as e:
              print(f"✗ TOML parse error: {e}")
              sys.exit(1)

          mod = manifest.get('mod', {})
          print(f"Mod ID: {mod.get('id')}")
          print(f"Version: {mod.get('version')}")
          print(f"Priority: {mod.get('priority')}")

          compat = manifest.get('compatibility', {})
          rev = compat.get('horizon_revision', 'MISSING')
          print(f"Horizon revision: {rev}")

          modules = manifest.get('module', [])
          injections = manifest.get('injection', [])
          print(f"Modules: {len(modules)}")
          print(f"Injections: {len(injections)}")

          errors = []
          if not mod.get('id'):
              errors.append("Missing [mod] id")
          if not mod.get('version'):
              errors.append("Missing [mod] version")
          if not rev or rev == 'MISSING':
              errors.append("Missing [compatibility] horizon_revision")
          if not modules:
              errors.append("No [[module]] entries")
          if not injections:
              errors.append("No [[injection]] entries")

          for i, inj in enumerate(injections):
              hook = inj.get('hook') or inj.get('target', '')
              if not hook:
                  errors.append(f"Injection {i} missing hook/target")

          if errors:
              print("✗ Errors:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)

          print(f"✓ Manifest valid: {len(modules)} modules, {len(injections)} injections")
          PYEOF

      - name: Verify hook points match Horizon source
        run: |
          rm -rf /tmp/mod-extract
          unzip -q -o forge_rs_gui.hnmod -d /tmp/mod-extract
          python3 << 'PYEOF'
          import toml, sys
          manifest = toml.load('/tmp/mod-extract/mixins/forge_rs_gui/horizon-mixin.toml')
          injections = manifest.get('injection', [])
          expected_hooks = {'mods', 'hud', 'frame', 'command', 'settings'}
          found_hooks = set()
          for inj in injections:
              hook = inj.get('hook', '')
              target = inj.get('target', '')
              if hook:
                  found_hooks.add(hook.split('::')[-1].split('<')[0])
              elif 'native_' in target:
                  found_hooks.add(target.split('::')[-1].split('<')[0])
          print(f'Found hooks: {found_hooks}')
          missing = expected_hooks - found_hooks
          if missing:
              print(f'✗ Missing hooks: {missing}')
              sys.exit(1)
          print('✓ All required hook points present')
          PYEOF

      - name: Upload .hnmod artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge_rs_gui.hnmod
          path: forge_rs_gui.hnmod
