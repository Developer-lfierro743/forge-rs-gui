name: Forge.rs GUI CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  validate-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip pkg-config libasound2-dev libwayland-dev libx11-dev libudev-dev
          pip3 install toml 2>/dev/null || pip install toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Clone Horizon source
        run: |
          git clone --depth=1 https://github.com/horizon-rust/horizon.git /tmp/horizon
          echo "HORIZON_PATH=/tmp/horizon" >> $GITHUB_ENV

      - name: Verify .hnmod structure
        run: |
          test -f forge_rs_gui.hnmod
          unzip -l forge_rs_gui.hnmod | grep -q "horizon-native.json"
          unzip -l forge_rs_gui.hnmod | grep -q "horizon-mixin.toml"
          unzip -l forge_rs_gui.hnmod | grep -q "mixins/forge_rs_gui/title_buttons.rs"
          unzip -l forge_rs_gui.hnmod | grep -q "mixins/forge_rs_gui/options_draw.rs"
          unzip -l forge_rs_gui.hnmod | grep -q "mixins/forge_rs_gui/hud.rs"
          echo "✓ .hnmod structure valid"

      - name: Validate manifest syntax and injection count
        run: |
          rm -rf /tmp/mod-extract
          unzip -q -o forge_rs_gui.hnmod -d /tmp/mod-extract
          python3 << 'PYEOF'
          import toml, sys
          try:
              manifest = toml.load('/tmp/mod-extract/mixins/forge_rs_gui/horizon-mixin.toml')
          except Exception as e:
              print(f"✗ TOML parse error: {e}")
              sys.exit(1)

          mod = manifest.get('mod', {})
          compat = manifest.get('compatibility', {})
          modules = manifest.get('module', [])
          injections = manifest.get('injection', [])

          errors = []
          if not mod.get('id') or not mod.get('version'):
              errors.append("Missing [mod] id/version")
          if not compat.get('horizon_revision'):
              errors.append("Missing [compatibility] horizon_revision")
          if not modules:
              errors.append("No [[module]] entries")
          if len(injections) < 8:
              errors.append(f"Expected >=8 injections, got {len(injections)}")

          print(f"Mod: {mod.get('id')} v{mod.get('version')}")
          print(f"Horizon revision: {compat.get('horizon_revision')}")
          print(f"Modules: {len(modules)}, Injections: {len(injections)}")

          if errors:
              for e in errors:
                  print(f"✗ {e}")
              sys.exit(1)
          print("✓ Manifest valid")
          PYEOF

      - name: Verify hook points and target injections
        run: |
          rm -rf /tmp/mod-extract
          unzip -q -o forge_rs_gui.hnmod -d /tmp/mod-extract
          python3 << 'PYEOF'
          import toml, sys
          manifest = toml.load('/tmp/mod-extract/mixins/forge_rs_gui/horizon-mixin.toml')
          injections = manifest.get('injection', [])

          # Collect hook points
          expected_hooks = {'mods', 'hud', 'frame', 'command', 'settings'}
          found_hooks = set()
          for inj in injections:
              hook = inj.get('hook', '')
              if hook:
                  found_hooks.add(hook)

          # Collect target patterns (flexible, ignore lifetime annotations)
          target_patterns = []
          for inj in injections:
              target = inj.get('target', '')
              if target:
                  # Strip lifetime params like <'_> for matching
                  import re
                  clean = re.sub(r'<[^>]*>', '', target)
                  target_patterns.append(clean)

          print(f'Hook points found: {found_hooks}')
          print(f'Target injections: {len(target_patterns)}')

          missing = expected_hooks - found_hooks
          if missing:
              print(f'✗ Missing hook points: {missing}')
              sys.exit(1)

          if len(target_patterns) < 5:
              print(f'✗ Expected >=5 target injections, got {len(target_patterns)}')
              sys.exit(1)

          # Flexible target checks (lifetime-agnostic)
          checks = [
              'title::Title::buttons',
              'options::Game::draw_options',
              'options::Game::options_mouse',
          ]
          all_targets = ' '.join(target_patterns)
          for needed in checks:
              if needed not in all_targets:
                  print(f'✗ Missing target: {needed}')
                  sys.exit(1)

          print('✓ All hook points and target injections present')
          PYEOF

      - name: Upload .hnmod artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge_rs_gui.hnmod
          path: forge_rs_gui.hnmod
