[mod]
id = "forge_rs_gui"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "9d979caa48a3bb58203319b9ea044db58c38e0d8"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "forge_rs_gui"
source = "runtime.rs"

# Hook-point injections (5 total)
[[injection]]
id = "listed"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "listed.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "hud"
hook = "hud"
hook_version = 1
kind = "HEAD"
helper = "hud.rs"
bindings = [
